const SESSION_DURATION = 3 * 60 * 60 * 1000;


/* OTURUM KONTROLÜ */
async function checkSession() {

    try {
        const localSession = JSON.parse(
            localStorage.getItem("mysoSession") || "null"
        );

        if (
            !localSession ||
            !localSession.authenticated ||
            !localSession.expiresAt ||
            Date.now() >= localSession.expiresAt
        ) {
            await supabaseClient.auth.signOut();
            localStorage.removeItem("mysoSession");
            window.location.href = "login.html";
            return false;
        }

        const { data, error } = await supabaseClient.auth.getSession();

        if (error || !data.session) {
            localStorage.removeItem("mysoSession");
            window.location.href = "login.html";
            return false;
        }

        return true;

    } catch (error) {
        console.error("Oturum kontrol hatası:", error);
        window.location.href = "login.html";
        return false;
    }
}


/* IP VEYA IP:PORT KONTROLÜ */
function isValidIpOrIpPort(value) {

    const parts = value.trim().split(":");

    if (parts.length > 2) return false;

    const ip = parts[0];
    const octets = ip.split(".");

    if (octets.length !== 4) return false;

    const validIp = octets.every(part =>
        /^\d{1,3}$/.test(part) &&
        Number(part) >= 0 &&
        Number(part) <= 255
    );

    if (!validIp) return false;

    if (parts.length === 1) return true;

    const portText = parts[1];

    if (!/^\d{1,5}$/.test(portText)) return false;

    const port = Number(portText);

    return port >= 1 && port <= 65535;
}

        name: document.getElementById("deviceName").value.trim(),

        ip: document.getElementById("deviceIP").value.trim(),

        modemBrand: document.getElementById("modemBrand").value,

        status: "offline"
