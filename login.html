<script>
"use strict";

const SUPABASE_URL = "https://shgotiioeboxmcmmoxwh.supabase.co";

const SUPABASE_KEY = "sb_publishable_XlDZ_uOq9ZKYQhZb5XwWtQ_EkzqP3uA";

const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

const SESSION_DURATION = 3 * 60 * 60 * 1000;

document.getElementById("loginForm").addEventListener("submit", login);

async function login(e) {
    e.preventDefault();

    const email = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value;

    const msg = document.getElementById("loginMsg");
    const button = document.getElementById("loginButton");
    const notify = document.getElementById("notify");

    button.disabled = true;
    button.innerText = "Giriş yapılıyor...";

    msg.innerText = "";

    try {

        const { data, error } = await supabaseClient.auth.signInWithPassword({
            email: email,
            password: password
        });

        if (error) {
            throw error;
        }

        const session = {
            authenticated: true,
            expiresAt: Date.now() + SESSION_DURATION
        };

        localStorage.setItem("mysoSession", JSON.stringify(session));

        msg.innerText = "";
        notify.classList.remove("d-none");

        setTimeout(() => {
            window.location.href = "index.html";
        }, 1200);

    } catch (error) {

        console.error("Giriş hatası:", error);

        msg.className = "mt-3 fw-bold text-danger";

        if (error.message.includes("Invalid login credentials")) {
            msg.innerText = "E-posta veya şifre hatalı!";
        } else {
            msg.innerText = "Giriş yapılamadı: " + error.message;
        }

    } finally {

        button.disabled = false;
        button.innerText = "Giriş Yap";

    }
}
</script>

</body>
